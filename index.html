<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora | Nayeli</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="calculadora">

            <div class="cabecalho">
                <div>
                    <h1>Calculadora</h1>
                    <p>HTML • CSS • JavaScript</p>
                </div>

                <button id="tema" class="tema" title="Alterar tema">
                    ☀
                </button>
            </div>

            <div class="visor">
                <div id="expressao" class="expressao"></div>
                <div id="resultado" class="resultado">0</div>
            </div>

            <div class="botoes">

                <button class="funcao" data-acao="limpar">AC</button>
                <button class="funcao" data-acao="apagar">⌫</button>
                <button class="operador" data-valor="%">%</button>
                <button class="operador" data-valor="/">÷</button>

                <button data-valor="7">7</button>
                <button data-valor="8">8</button>
                <button data-valor="9">9</button>
                <button class="operador" data-valor="*">×</button>

                <button data-valor="4">4</button>
                <button data-valor="5">5</button>
                <button data-valor="6">6</button>
                <button class="operador" data-valor="-">−</button>

                <button data-valor="1">1</button>
                <button data-valor="2">2</button>
                <button data-valor="3">3</button>
                <button class="operador" data-valor="+">+</button>

                <button class="zero" data-valor="0">0</button>
                <button data-valor=".">.</button>
                <button class="igual" data-acao="calcular">=</button>

            </div>

            <div class="historico">

                <div class="historico-topo">
                    <h2>Histórico</h2>

                    <button id="limparHistorico">
                        Limpar
                    </button>
                </div>

                <ul id="listaHistorico"></ul>

            </div>

            <footer>
                Desenvolvido por <strong>Nayeli</strong>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
